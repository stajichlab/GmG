[package]
name = "gmg-cli"
description = "gmg: guess a fungal genome's taxonomy from FracMinHash sketches"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "gmg"
path = "src/main.rs"

[dependencies]
gmg-core = { path = "../gmg-core", features = ["json"] }
gmg-report = { path = "../gmg-report" }
gmg-pdf = { path = "../gmg-pdf" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
flate2 = "1"
needletail = "0.7.3"
rayon = "1"
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
