[package]
name = "popsketch"
description = "Audit a set of read files and draw coarse population structure from FracMinHash sketches"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "popsketch"
path = "src/lib.rs"

[[bin]]
name = "popsketch"
path = "src/main.rs"

[dependencies]
gmg-core = { path = "../gmg-core", features = ["json"] }
gmg-input = { path = "../gmg-input" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
needletail = "0.7.3"
rayon = "1"
serde_json = "1"
