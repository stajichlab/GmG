[package]
name = "gmg-wasm"
description = "GmG for the browser / Node: load a reference index, sketch a FASTA/FASTQ in memory, guess"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gmg-core = { path = "../gmg-core", features = ["json"] }
gmg-report = { path = "../gmg-report" }
serde_json = "1"
# keep equal to the wasm-bindgen-cli version in pixi.toml
wasm-bindgen = "=0.2.129"
