[package]
name = "gmg-core"
description = "Guess My Genome: sourmash-compatible FracMinHash sketching and comparison (wasm-friendly core)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
murmurhash3 = "0.0.5"

[dev-dependencies]
# Native-only oracle: gmg-core sketches must be hash-identical to sourmash's.
sourmash = "0.23.0"
needletail = { version = "0.7.3", default-features = false }
