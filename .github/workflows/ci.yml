name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIXI_VERSION: v0.83.0

jobs:
  check:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          locked: true
          cache: true
      - run: pixi run fmt
      - run: pixi run clippy

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          locked: true
          cache: true
      - name: Rust tests (unit + sourmash-crate oracle)
        run: pixi run test
      - name: Python tests (analysis scripts)
        run: pixi run pytest

  wasm:
    name: wasm parity (wasm vs native CLI)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          locked: true
          cache: true
      - run: pixi run wasm-test
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: gmg-wasm-web
          path: crates/gmg-wasm/pkg-web
          retention-days: 14

  container:
    name: container build (linux/amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Log in to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push :edge from main)
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/gmg:edge
          build-args: GMG_GIT_HASH=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: |
          docker buildx build --platform linux/amd64 --load -t gmg:ci --build-arg GMG_GIT_HASH=${{ github.sha }} .
          docker run --rm gmg:ci --version
