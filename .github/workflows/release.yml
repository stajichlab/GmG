name: Release

# Tag `vX.Y.Z` to publish: gmg binaries (linux-64, osx-arm64), the wasm package, and the OCI image on GHCR
# (`ghcr.io/stajichlab/gmg:X.Y.Z` and `:latest`; convert on the HPCC with `apptainer pull docker://...`).
# "Run workflow" (workflow_dispatch) does a dry run: builds everything, publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PIXI_VERSION: v0.83.0

jobs:
  binaries:
    name: gmg ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: linux-64}
          - {os: macos-15, target: osx-arm64}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          locked: true
          cache: true
      - run: pixi run build
      - name: Package
        run: |
          name="gmg-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp target/release/gmg LICENSE README.md "$name"/
          cp -r data/thresholds "$name"/thresholds
          "$name"/gmg --version
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: gmg-${{ matrix.target }}
          path: gmg-*.tar.gz*

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          locked: true
          cache: true
      - run: pixi run wasm-test
      - name: Package
        run: |
          name="gmg-wasm-${GITHUB_REF_NAME}"
          mkdir "$name"
          cp -r crates/gmg-wasm/pkg-web "$name"/web
          cp -r crates/gmg-wasm/pkg-node "$name"/node
          cp LICENSE "$name"/
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: gmg-wasm
          path: gmg-wasm-*.tar.gz*

  image:
    name: OCI image (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/gmg
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=dryrun,enable=${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GMG_GIT_HASH=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [binaries, wasm, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
